{% set name = "temporalio" %}
{% set version = "1.30.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7c025919511bb465392d547e48ccb85fd560a995db4ebcc82fdb43cddf088e6f

build:
  number: 0
  skip: true  # [py<310]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cd temporalio/bridge
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - libprotobuf
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.0,<2.0
    - pip
  run:
    - python
    - nexus-rpc ==1.4.0
    - protobuf >=3.20,<8.0.0
    - python-dateutil >=2.8.2,<3  # [py<311]
    - types-protobuf >=3.20,<8.0.0
    - typing_extensions >=4.2.0,<5
  run-constrained:
    # grpc
    - grpcio >=1.48.2,<2
    # opentelemetry
    - opentelemetry-api >=1.11.1,<2
    - opentelemetry-sdk >=1.11.1,<2
    # lambda-worker-otel
    - opentelemetry-exporter-otlp-proto-grpc >=1.11.1,<2
    - opentelemetry-semantic-conventions >=0.40b0,<1
    # pydantic
    - pydantic >=2.0.0,<3
    # openai-agents
    - openai-agents >=0.17.5
    - mcp >=1.9.4,<2
    # langgraph
    - langgraph >=1.1.0
    # langsmith
    - langsmith >=0.7.34,<0.9
test:
  imports:
    - temporalio
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/temporalio/sdk-python
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - temporalio/bridge/THIRDPARTY.yml
    - temporalio/bridge/sdk-core/LICENSE.txt
    - temporalio/bridge/sdk-core/crates/protos/protos/api_cloud_upstream/LICENSE
    - temporalio/bridge/sdk-core/crates/protos/protos/api_upstream/LICENSE
  summary: Temporal.io Python SDK
  description: |
    Temporal is a distributed, scalable, durable, and highly available orchestration engine used to execute asynchronous,
    long-running business logic in a scalable and resilient way.
  dev_url: https://github.com/temporalio/sdk-python
  doc_url: https://docs.temporal.io/docs/python

extra:
  recipe-maintainers:
    - chrisjryan
    - dgasmith
    - nic-chira
    - fzding
    - chrisdeutsch
  skip-linnts:
    - reachable_url